global:
  prefect:
    image:
      repository: prefecthq/prefect
      prefectTag: 3.8.8-python3.13

server:
  basicAuth:
    enabled: false
  uiConfig:
    prefectUiApiUrl: http://localhost:4200/api
  env:
    - name: PREFECT_SERVER_ANALYTICS_ENABLED
      value: "false"

service:
  type: ClusterIP
  port: 4200

ingress:
  enabled: false

secret:
  create: false

postgresql:
  enabled: true
  auth:
    username: prefect
    database: server
    existingSecret: prefect-postgresql
  primary:
    persistence:
      enabled: true
      storageClass: csi-cinder-high-speed
      size: 10Gi
